<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎁</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #d8c7ff);
    overflow: hidden;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.9);
    padding: 45px 30px;
    border-radius: 25px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    animation: appear 1.2s ease;
}

h1 {
    color: #ff4f81;
    font-size: 30px;
}

p {
    color: #555;
    font-size: 18px;
}

input {
    width: 80%;
    padding: 14px;
    border: 2px solid #ff8fab;
    border-radius: 12px;
    text-align: center;
    font-size: 20px;
    outline: none;
    margin: 15px 0;
}

button {
    padding: 13px 30px;
    border: none;
    border-radius: 12px;
    background: #ff4f81;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #e83e70;
    transform: scale(1.05);
}

#error {
    color: red;
    display: none;
    margin-top: 15px;
}

.heart {
    position: absolute;
    font-size: 25px;
    animation: float 5s infinite ease-in-out;
}

.heart:nth-child(1) {
    left: 10%;
    top: 20%;
}

.heart:nth-child(2) {
    right: 10%;
    top: 30%;
}

.heart:nth-child(3) {
    left: 20%;
    bottom: 15%;
}

.heart:nth-child(4) {
    right: 20%;
    bottom: 20%;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-25px);
    }
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio autoplay loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="heart">💖</div>
<div class="heart">💕</div>
<div class="heart">💗</div>
<div class="heart">💝</div>

<div class="container">

    <h1>✨ Something special is hidden inside… ✨</h1>

    <p>🔐 Enter the secret password</p>

    <input 
        type="password"
        id="password"
        maxlength="3"
        placeholder="•••"
    >

    <br>

    <button onclick="unlock()">🔓 Unlock Surprise</button>

    <p id="error">❌ Wrong password! Try again.</p>

</div>

<script>

function unlock() {

    let password = document.getElementById("password").value;

    if (password === "565") {

        window.location.href = "page2.html";

    } else {

        document.getElementById("error").style.display = "block";

    }

}

</script>

</body>
</html>
