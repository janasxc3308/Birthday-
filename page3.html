<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Message 💌</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffc8dd, #cdb4db);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 600px;
    background: rgba(255,255,255,0.94);
    padding: 40px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4081;
    font-size: 28px;
}

textarea {
    width: 90%;
    height: 130px;
    border: 2px solid #ff8fab;
    border-radius: 15px;
    padding: 15px;
    font-size: 17px;
    resize: none;
    outline: none;
}

button {
    margin-top: 20px;
    padding: 13px 30px;
    border: none;
    border-radius: 12px;
    background: #ff4081;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.heart {
    font-size: 45px;
    animation: beat 1.2s infinite;
}

@keyframes beat {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.2);
    }
}
</style>
</head>

<body>

<audio autoplay loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <div class="heart">💖</div>

    <h1>What you want, tell me. I will try to give you. ❤️</h1>

    <textarea id="message" placeholder="Type your wish here..."></textarea>

    <br>

    <button onclick="sendWhatsApp()">
        💌 Send
    </button>

</div>

<script>
function sendWhatsApp() {

    let message = document.getElementById("message").value;

    if (message.trim() === "") {
        alert("Please type a message first 😊");
        return;
    }

    let phone = "9952257447";

    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
}
</script>

</body>
</html>
